name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: n1code/main/package-lock.json

      - name: Install Dependencies
        working-directory: ./n1code/main
        run: npm ci

      - name: Run Tests
        working-directory: ./n1code/main
        run: npm run test
        env:
          VITE_FIREBASE_API_KEY: mock
          VITE_FIREBASE_AUTH_DOMAIN: mock
          VITE_FIREBASE_PROJECT_ID: mock
          VITE_FIREBASE_STORAGE_BUCKET: mock
          VITE_FIREBASE_MESSAGING_SENDER_ID: mock
          VITE_FIREBASE_APP_ID: mock
          RESEND_API_KEY: mock

  test-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: n1code/admin/package-lock.json

      - name: Install Dependencies
        working-directory: ./n1code/admin
        run: npm ci

      - name: Run Tests
        working-directory: ./n1code/admin
        run: npm run test
        env:
          VITE_FIREBASE_API_KEY: mock
          VITE_FIREBASE_AUTH_DOMAIN: mock
          VITE_FIREBASE_PROJECT_ID: mock
          VITE_FIREBASE_STORAGE_BUCKET: mock
          VITE_FIREBASE_MESSAGING_SENDER_ID: mock
          VITE_FIREBASE_APP_ID: mock
